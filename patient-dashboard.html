<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient dashboard — Hospital Management System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-cross"></span>Hospital Management System</a>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<main class="page">
  <div class="container">
    <section class="hero">
      <h1 id="welcomeName">Welcome</h1>
      <p id="welcomeSub"></p>
    </section>

    <div class="dash-grid">
      <div class="panel panel-full">
        <h2>Book an appointment</h2>
        <div class="alert" id="bookAlert"></div>

        <form id="bookForm" novalidate>
          <div class="field">
            <label for="apDoctor">Doctor</label>
            <select id="apDoctor"></select>
          </div>
          <div class="field">
            <label for="apDate">Date</label>
            <input type="date" id="apDate">
          </div>
          <div class="field">
            <label for="apTime">Time</label>
            <input type="time" id="apTime">
          </div>
          <div class="field">
            <label for="apReason">Reason for visit</label>
            <textarea id="apReason" placeholder="e.g. Fever and headache for three days."></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Request appointment</button>
        </form>
      </div>

      <div>
        <h2>My appointments</h2>
        <div class="appt-list" id="apptList"></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">Hospital Management System · a student project</footer>

<script src="script.js"></script>
</body>
</html>
