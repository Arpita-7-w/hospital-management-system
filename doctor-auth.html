<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor portal — Hospital Management System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-role="doctor">

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-cross"></span>Hospital Management System</a>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<main class="auth-wrap">
  <div class="panel">
    <h2>Doctor portal</h2>
    <p>Log in, or create a doctor account.</p>

    <div class="tabs">
      <button type="button" class="tab active" data-target="loginForm">Log in</button>
      <button type="button" class="tab" data-target="registerForm">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" novalidate>
      <div class="alert" id="loginAlert"></div>
      <div class="field">
        <label for="lEmail">Email</label>
        <input type="email" id="lEmail" placeholder="doctor@hospital.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="lPassword">Password</label>
        <input type="password" id="lPassword" placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden" novalidate>
      <div class="alert" id="registerAlert"></div>
      <div class="field">
        <label for="rName">Full name</label>
        <input type="text" id="rName" placeholder="Dr. Ayesha Rahman" autocomplete="name">
      </div>
      <div class="field">
        <label for="rEmail">Email</label>
        <input type="email" id="rEmail" placeholder="doctor@hospital.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="rSpecialty">Specialty</label>
        <select id="rSpecialty">
          <option value="">Choose specialty</option>
          <option>General Physician</option>
          <option>Cardiologist</option>
          <option>Dermatologist</option>
          <option>Pediatrician</option>
          <option>Orthopedic</option>
          <option>Gynecologist</option>
          <option>Neurologist</option>
          <option>ENT Specialist</option>
        </select>
      </div>
      <div class="field">
        <label for="rPassword">Password</label>
        <input type="password" id="rPassword" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="rConfirm">Confirm password</label>
        <input type="password" id="rConfirm" placeholder="Re-enter password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create doctor account</button>
    </form>

    <p class="form-note">Are you a patient? <a href="patient-auth.html" class="text-link">Go to patient portal</a></p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
